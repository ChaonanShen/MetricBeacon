services:
  assistant-mcp:
    build: {context: ., dockerfile: services/assistant-mcp/Dockerfile}
    ports: ["127.0.0.1:8081:8081"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/readyz || exit 1"], interval: 5s, timeout: 3s, retries: 12}
  ai-core:
    build: {context: ., dockerfile: services/ai-core/Dockerfile}
    environment: {ASSISTANT_MCP_ENDPOINT: "http://assistant-mcp:8081/mcp"}
    depends_on: {assistant-mcp: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["ai-core-data:/var/lib/ai-core"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz || exit 1"], interval: 5s, timeout: 3s, retries: 12}
  grafana:
    build: {context: ., dockerfile: apps/grafana-plugin/Dockerfile}
    environment:
      AI_CORE_ENDPOINT: "http://ai-core:8080"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mini-torchbearing-app
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on: {ai-core: {condition: service_healthy}}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"], interval: 5s, timeout: 3s, retries: 24}
volumes:
  ai-core-data: {}
