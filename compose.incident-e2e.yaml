services:
  assistant-mcp:
    environment:
      ASSISTANT_MCP_INCIDENT_ENABLED: "true"
      ASSISTANT_MCP_REMEDIATION_ENABLED: "true"
      ASSISTANT_MCP_ORDER_DRIVER: http
      ASSISTANT_MCP_ORDER_URL: http://order-service:8091
      ASSISTANT_MCP_ORDER_READ_TOKEN: "incident-read-development-token"
      ASSISTANT_MCP_ORDER_REMEDIATION_TOKEN: "incident-remediation-development-token"
      ASSISTANT_MCP_CHECKPOINT_KEY: "incident-checkpoint-development-key-v1"
      ORDER_INCIDENT_APPROVAL_EVIDENCE_KEY: "incident-approval-evidence-development-key-v1"
      ASSISTANT_MCP_EXECUTION_AUDIT_PATH: /var/lib/assistant-mcp/execution-audit.jsonl
    volumes: [assistant-mcp-audit:/var/lib/assistant-mcp]
    depends_on: {order-service: {condition: service_healthy}}
    networks: [default, order-ops]

  ai-core:
    environment:
      ORDER_INCIDENT_WEBHOOK_SECRET: "incident-webhook-development-secret"
      ORDER_INCIDENT_APPROVAL_EVIDENCE_KEY: "incident-approval-evidence-development-key-v1"

  grafana:
    environment:
      ORDER_INCIDENT_WEBHOOK_SECRET: "incident-webhook-development-secret"
    volumes:
      - ./deploy/grafana/provisioning/datasources/prometheus-incident.yaml:/etc/grafana/provisioning/datasources/prometheus-incident.yaml:ro
      - ./deploy/grafana/provisioning/alerting/order-incident.yaml:/etc/grafana/provisioning/alerting/order-incident.yaml:ro

  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus-incident.yml:/etc/prometheus/prometheus.yml:ro
    networks: [default, order-metrics]

  order-service:
    build: {context: ., dockerfile: services/order-demo/Dockerfile}
    environment:
      ORDER_DEMO_READ_TOKEN: "incident-read-development-token"
      ORDER_DEMO_REMEDIATION_TOKEN: "incident-remediation-development-token"
      ORDER_DEMO_FAULT_SOCKET: /run/order-demo/control.sock
    volumes: [order-fault-socket:/run/order-demo]
    networks: [order-business, order-ops, order-metrics]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/readyz || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 30

  loadgen:
    build: {context: ., dockerfile: services/order-demo/Dockerfile}
    entrypoint: ["/usr/local/bin/loadgen"]
    environment:
      ORDER_DEMO_BUSINESS_ENDPOINT: http://order-service:8090
      ORDER_DEMO_LOAD_PER_SECOND: "2"
    depends_on: {order-service: {condition: service_healthy}}
    networks: [order-business]

  fault-controller:
    build: {context: ., dockerfile: services/order-demo/Dockerfile}
    entrypoint: ["/usr/local/bin/fault-controller"]
    environment:
      ORDER_DEMO_FAULT_SOCKET: /run/order-demo/control.sock
    volumes: [order-fault-socket:/run/order-demo]
    network_mode: none
    depends_on: {order-service: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/healthz || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 30

volumes:
  order-fault-socket: {}
  assistant-mcp-audit: {}

networks:
  order-business: {internal: true}
  order-ops: {internal: true}
  order-metrics: {internal: true}
