openapi: 3.1.1
info:
  title: Mini Torchbearing AI Core API
  version: v1
  description: Internal API used only by the Grafana Plugin Backend.
  license: {name: UNLICENSED, identifier: UNLICENSED}
servers:
  - url: http://ai-core:8080
security:
  - InternalServiceIdentity: []
paths:
  /internal/v1/alerts/grafana:
    post:
      summary: Accept a bounded Grafana Alerting webhook after source and HMAC verification
      description: This machine endpoint does not accept Grafana user identity headers. The signature is lowercase hexadecimal HMAC-SHA256 over `timestamp + ":" + rawBody`.
      security: []
      x-mtb-timeout-ms: 10000
      operationId: ingestGrafanaAlert
      parameters:
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertTimestamp'
        - $ref: '#/components/parameters/AlertSignature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GrafanaAlertWebhook'}}}
      responses:
        '202': {description: Firing alerts accepted or deduplicated, content: {application/json: {schema: {$ref: '#/components/schemas/AlertIngressResponse'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /healthz:
    get:
      summary: Report process liveness
      x-mtb-timeout-ms: 1000
      operationId: healthz
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      summary: Report storage and MCP dependency readiness
      x-mtb-timeout-ms: 5000
      operationId: readyz
      responses:
        '200': {description: "Migrations, storage and MCP dependency are ready"}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /v1/sessions:
    get:
      summary: List the current creator's non-empty Sessions by recent activity
      x-mtb-timeout-ms: 10000
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/PageSizeSessions'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Owner-scoped Session page, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    post:
      summary: Create a Session with Plugin-derived RequestContext
      x-mtb-timeout-ms: 10000
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSessionRequest'}}}
      responses:
        '201': {description: Session created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/sessions/{sessionId}:
    get:
      summary: Get a tenant-scoped Session
      x-mtb-timeout-ms: 10000
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Session snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/sessions/{sessionId}/messages:
    get:
      summary: List tenant-scoped Session Messages by stable descending keyset page
      x-mtb-timeout-ms: 10000
      operationId: listSessionMessages
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/PageSizeMessages'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Message page, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePage'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/sessions/{sessionId}/tasks:
    get:
      summary: List tenant-scoped Session Tasks by stable descending keyset page
      x-mtb-timeout-ms: 10000
      operationId: listSessionTasks
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/PageSizeTasks'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Task page, content: {application/json: {schema: {$ref: '#/components/schemas/TaskPage'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/tasks:
    post:
      summary: Create an asynchronous tenant-scoped Task
      x-mtb-timeout-ms: 10000
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateTaskRequest'}}}
      responses:
        '202': {description: Task accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/tasks/{taskId}:
    get:
      summary: Get a tenant-scoped Task
      x-mtb-timeout-ms: 10000
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Task snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/incidents:
    get:
      summary: List organization-visible Incident Tasks by recent activity
      x-mtb-timeout-ms: 10000
      operationId: listIncidents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/PageSizeTasks'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Organization-scoped Incident Task page, content: {application/json: {schema: {$ref: '#/components/schemas/TaskPage'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/tasks/{taskId}/approval:
    get:
      summary: Get the current pending or decided Approval for an Incident Task
      x-mtb-timeout-ms: 10000
      operationId: getTaskApproval
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Approval snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    post:
      summary: Admin decision over the exact immutable Incident Intent
      x-mtb-timeout-ms: 10000
      operationId: decideTaskApproval
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DecideApprovalRequest'}}}
      responses:
        '202': {description: Decision persisted and workflow scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/tasks/{taskId}/events:
    get:
      summary: Replay and follow durable tenant-scoped TaskEvents
      x-mtb-timeout-ms: 0
      operationId: streamTaskEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Durable TaskEvent stream, content: {text/event-stream: {schema: {$ref: '#/components/schemas/TaskEvent'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /v1/tasks/{taskId}/events/replay:
    get:
      summary: Read a finite durable TaskEvent replay page with a fixed target sequence
      x-mtb-timeout-ms: 10000
      operationId: replayTaskEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/PageSizeReplay'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TraceParent'
      responses:
        '200': {description: Finite replay page, content: {application/json: {schema: {$ref: '#/components/schemas/TaskEventReplayPage'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
components:
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
    RequestId: {name: X-Request-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    TraceId: {name: X-Trace-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    TraceParent: {name: traceparent, in: header, required: false, schema: {type: string, minLength: 1}}
    AfterSequence: {name: afterSequence, in: query, required: false, schema: {type: integer, minimum: 0}}
    PageSizeMessages: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    PageSizeTasks: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    PageSizeSessions: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    PageSizeReplay: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 200}}
    PageToken: {name: pageToken, in: query, required: false, schema: {type: string, minLength: 1}}
    LastEventId: {name: Last-Event-ID, in: header, required: false, schema: {type: integer, minimum: 0}}
    TenantId: {name: X-MTB-Tenant-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    OrgId: {name: X-MTB-Org-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    UserId: {name: X-MTB-User-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    Roles: {name: X-MTB-Roles, in: header, required: true, schema: {type: string, minLength: 1}, description: "Comma-separated, trimmed and de-duplicated roles."}
    Permissions: {name: X-MTB-Permissions, in: header, required: true, schema: {type: string, minLength: 1}, description: "Comma-separated permissions; must include datasources:query for this profile."}
    AlertSource: {name: X-MTB-Alert-Source, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
    AlertTimestamp: {name: X-MTB-Alert-Timestamp, in: header, required: true, schema: {type: integer, minimum: 1}, description: Unix timestamp accepted only within the configured replay window.}
    AlertSignature: {name: X-Grafana-Alerting-Signature, in: header, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
  schemas:
    CreateSessionRequest: {$ref: '../schemas/api/create-session-request.schema.json'}
    CreateTaskRequest: {$ref: '../schemas/api/create-task-request.schema.json'}
    Session: {$ref: '../schemas/session/session.schema.json'}
    SessionPage: {$ref: '../schemas/api/session-page.schema.json'}
    Message: {$ref: '../schemas/session/message.schema.json'}
    Task: {$ref: '../schemas/task/task.schema.json'}
    MessagePage: {$ref: '../schemas/api/message-page.schema.json'}
    TaskPage: {$ref: '../schemas/api/task-page.schema.json'}
    TaskEventReplayPage: {$ref: '../schemas/api/task-event-replay-page.schema.json'}
    Chart: {$ref: '../schemas/chart/chart.schema.json'}
    ChartExecution: {$ref: '../schemas/chart/execution.schema.json'}
    TaskEvent: {$ref: '../events/task-events.schema.json'}
    ErrorEnvelope: {$ref: '../schemas/common/error.schema.json'}
    GrafanaAlertWebhook: {$ref: '../schemas/incident/grafana-alert-webhook.schema.json'}
    AlertIngressResponse: {$ref: '../schemas/incident/alert-ingress-response.schema.json'}
    Approval: {$ref: '../schemas/approval/approval.schema.json'}
    DecideApprovalRequest: {$ref: '../schemas/api/decide-approval-request.schema.json'}
  responses:
    ErrorResponse:
      description: Structured domain error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  securitySchemes:
    InternalServiceIdentity:
      type: apiKey
      in: header
      name: X-MTB-Tenant-ID
