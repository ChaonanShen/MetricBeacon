services:
  assistant-mcp:
    environment:
      ASSISTANT_MCP_PROMETHEUS_DRIVER: http
      ASSISTANT_MCP_PROMETHEUS_URL: http://prometheus:9090
      ASSISTANT_MCP_PROMETHEUS_DATASOURCE_UID: prometheus-main
      ASSISTANT_MCP_PROMETHEUS_TIMEOUT: 10s
    depends_on:
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.0@sha256:9b0ade5e607f9dbedb0a8e11151b6011ae5bd79304c261804cfdd2cadf200a80
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
